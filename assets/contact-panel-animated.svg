<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Contact signal</title>
  <desc id="desc">One continuous signal travels from personal email through Weekly Backing Track to the Jam Tracks Hub music platform</desc>

  <style>
    .signal-flow {
      fill: none;
      stroke: #A8754F;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 82 918;
      opacity: 0;
      animation: signal-propagation 6s linear infinite;
    }

    .communication-accent,
    .audio-accent,
    .digital-accent {
      fill: none;
      stroke: #355B4B;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
    }

    .communication-accent { animation: communication-stage 6s ease-in-out infinite; }
    .audio-accent { animation: audio-stage 6s ease-in-out infinite; }
    .digital-accent { animation: digital-stage 6s ease-in-out infinite; }

    .travel-node {
      fill: #355B4B;
      opacity: 0;
    }

    .endpoint-pulse {
      fill: none;
      stroke: #A8754F;
      stroke-width: 2;
      opacity: 0;
      animation: endpoint-pulse 6s ease-in-out infinite;
    }

    @keyframes signal-propagation {
      0%, 3% { opacity: 0; stroke-dashoffset: 0; }
      7% { opacity: 0.82; stroke-dashoffset: 0; }
      84% { opacity: 0.82; stroke-dashoffset: -918; }
      88%, 100% { opacity: 0; stroke-dashoffset: -1000; }
    }

    @keyframes communication-stage {
      0%, 3%, 34%, 100% { opacity: 0; }
      8%, 28% { opacity: 0.58; }
    }

    @keyframes audio-stage {
      0%, 29%, 65%, 100% { opacity: 0; }
      38%, 57% { opacity: 0.62; }
      47% { opacity: 0.8; }
    }

    @keyframes digital-stage {
      0%, 60%, 89%, 100% { opacity: 0; }
      69%, 84% { opacity: 0.62; }
    }

    @keyframes endpoint-pulse {
      0%, 82%, 94%, 100% { opacity: 0; }
      87% { opacity: 0.7; }
      91% { opacity: 0.22; }
    }

    @media (prefers-reduced-motion: reduce) {
      .signal-flow,
      .communication-accent,
      .audio-accent,
      .digital-accent,
      .travel-node,
      .endpoint-pulse {
        animation: none !important;
        display: none !important;
      }
    }
  </style>

  <rect x="1" y="1" width="998" height="248" rx="18" fill="#F2F3EA" stroke="#D8D1C3" stroke-width="2"/>
  <path d="M333.333 32V132M666.667 32V132" fill="none" stroke="#D8D1C3" stroke-width="1"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="166.667" y="66" fill="#A8754F" font-size="13" font-weight="700" letter-spacing="2.2">PERSONAL EMAIL</text>
    <text x="166.667" y="103" fill="#355B4B" font-size="22" font-weight="600" letter-spacing="1">DIRECT CONTACT</text>

    <text x="500" y="66" fill="#A8754F" font-size="13" font-weight="700" letter-spacing="2.2">YOUTUBE</text>
    <text x="500" y="103" fill="#355B4B" font-size="22" font-weight="600" letter-spacing="1">WEEKLY BACKING TRACK</text>

    <text x="833.333" y="66" fill="#A8754F" font-size="13" font-weight="700" letter-spacing="2.2">JAM TRACKS HUB</text>
    <text x="833.333" y="103" fill="#355B4B" font-size="22" font-weight="600" letter-spacing="1">MUSIC PLATFORM</text>
  </g>

  <path
    id="contact-signal"
    d="M50 178H108L121 164L134 192L149 148L164 197L179 160L194 178H350H388L400 170L412 186L425 158L438 194L451 150L464 200L477 157L490 190L503 165L516 185L530 173L544 178H650H708V154H752V198H796V162H840V190H884V178H950"
    pathLength="1000"
    fill="none"
    stroke="#CAD7CE"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <g fill="#A8754F">
    <circle cx="50" cy="178" r="3"/>
    <circle cx="333.333" cy="178" r="2.5"/>
    <circle cx="666.667" cy="178" r="2.5"/>
    <circle cx="950" cy="178" r="3"/>
  </g>

  <use class="signal-flow" href="#contact-signal" xlink:href="#contact-signal"/>
  <path class="communication-accent" d="M50 178H108L121 164L134 192L149 148L164 197L179 160L194 178H333.333"/>
  <path class="audio-accent" d="M350 178H388L400 168L412 188L425 154L438 198L451 146L464 204L477 153L490 194L503 162L516 188L530 171L544 178H650"/>
  <path class="digital-accent" d="M666.667 178H708V154H752V198H796V162H840V190H884V178H950"/>

  <circle class="travel-node" cx="0" cy="0" r="4.5">
    <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.05;0.84;0.88;1" dur="6s" repeatCount="indefinite"/>
    <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.05;0.84;1" calcMode="linear">
      <mpath href="#contact-signal" xlink:href="#contact-signal"/>
    </animateMotion>
  </circle>
  <circle class="endpoint-pulse" cx="950" cy="178" r="10"/>

  <g fill="#D8D1C3">
    <circle cx="166.667" cy="222" r="2"/>
    <circle cx="500" cy="222" r="2"/>
    <circle cx="833.333" cy="222" r="2"/>
  </g>
</svg>
